name: Claude Auto Code

on:
  issues:
    types: [opened]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Target issue number to implement"
        required: true
        type: string

      command:
        description: "Claude command"
        required: true
        type: choice
        default: build
        options:
          - build
          - fix
          - hotfix

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  Implement:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        contains(github.event.comment.body, '@toro')
      )

    uses: tmc-ccoe/toro-claude-code/.github/workflows/toro-claude-code.yml@v1

    secrets: inherit

    with:
      model: ${{ vars.TORO_CLAUDE_OPUS }}
      aws_iam_role_arn: arn:aws:iam::905418085415:role/trust-dev-bastion-role
      aws_region: ap-northeast-1
      max_turns: 256
      verbose_logs: true
      timeout_minutes: 120

      task_prompt: >-
        ${{
          github.event_name == 'workflow_dispatch'
            && format('/{0} --auto #{1}', inputs.command, inputs.issue_number)
            || format(
              '{0} --auto #{1}',
              startsWith(github.event.issue.title, 'hotfix:')
                && '/hotfix'
                || (
                  startsWith(github.event.issue.title, 'bug:')
                  || startsWith(github.event.issue.title, 'fix:')
                )
                && '/fix'
                || '/build',
              github.event.issue.number
            )
        }}