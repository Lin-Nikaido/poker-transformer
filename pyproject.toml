[project]
name = "poker-transformer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pokerkit>=0.7.6,<0.8",
    "pydantic>=2.12,<3",
    "torch>=2.10,<3",
]

[project.scripts]
poker = "poker.cli.__main__:main"

[project.optional-dependencies]
dev = [
    "lefthook>=2.1.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-profiling>=1.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.8",
    "typer>=0.27.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]
force-exclude = true
line-length = 79

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "A",     # flake8-builtins
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "D",     # Missing docstring
    "COM",   # flake8-commas
    "ASYNC", # flake8-async
    "RSE",   # raise rules
    "ARG",   # arguments
]

ignore = [
    "E501",   # line-too-long
    "B008",   # function-call-in-default-argument. need to FastAPI
    "SIM108", # if-else-block-instead-of-if-exp
    "D105",
    "D107",   # Missing docstring in `__init__`
    "D203",   # incorrect-blank-line-before-class, use `blank-line-before-class` (D211)
    "D205",
    "D212",   # multi-line-summary-first-line, use `multi-line-summary-second-line` (D213)
    "D400",   # First line should end with a period
    "D401",   # non-imperative mood
    "D414",
    "D415",
    "D417",
    "COM812",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
force-wrap-aliases = true
combine-as-imports = false
split-on-trailing-comma = true
known-first-party = ["poker"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]


[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "ARG001",
    "ARG002",
    "ARG003",
    "ARG005",
    "B017",
    "N806",
    "RUF001",
    "RUF043",
    "SIM117",
    "ASYNC230",
]
"**/__init__.py" = [
    "D104"
]
